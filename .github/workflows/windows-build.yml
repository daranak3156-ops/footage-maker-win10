name: Build Windows 10 application

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        shell: powershell
        run: choco install ffmpeg -y --no-progress
      - name: Check source
        shell: powershell
        run: python -m py_compile footage_maker.py desktop_app.pyw
      - name: Test online media search and download
        shell: powershell
        run: |
          python -c "from pathlib import Path; from footage_maker import commons_search,download; items=commons_search('Kyiv'); assert items, 'No reusable media found'; print(items[0]['title']); download(items[0]['url'], Path('media_smoke.bin'))"
      - name: Build portable application
        shell: powershell
        run: .\build_windows.ps1
      - name: Verify executable and bundled tools
        shell: powershell
        run: |
          $folder = 'dist\FootageMaker'
          foreach ($path in @('FootageMaker.exe', '_ffmpeg\ffmpeg.exe', '_ffmpeg\ffprobe.exe', 'config.json', 'demo_script.txt')) {
            if (-not (Test-Path (Join-Path $folder $path))) { throw "Missing $path" }
          }
          $app = Start-Process -FilePath (Join-Path $folder 'FootageMaker.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Executable self-test failed: $($app.ExitCode)" }
      - name: Zip portable folder
        shell: powershell
        run: Compress-Archive -Path dist\FootageMaker -DestinationPath FootageMaker_Windows10.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FootageMaker_Windows10
          path: FootageMaker_Windows10.zip
